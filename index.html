<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>加载页面中</title>
</head>
<body style="margin:0;padding:0;height:100vh;overflow:hidden;">
<iframe id="myframe" src="http://onlivechat.dpdns.org/" style="width:100%;height:100%;border:none;"></iframe>
<script>
const iframe = document.getElementById('myframe');
iframe.onload = function(){
    try{
        // 跨域页面这里一定会报错，捕获到就是跨域了
        document.title = iframe.contentDocument.title;
    }catch(e){
        console.log('跨域，无法获取远程标题');
    }
}
</script>
</body>
</html>
